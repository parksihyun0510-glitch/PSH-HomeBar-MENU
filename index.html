<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sihyeon's Lounge</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        /* 세리프(명조) 폰트 추가 로드 (표지 고급화) */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f5f6f8;
            color: #333333;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* -------------------------------------
           [1] 인트로(대문) 페이지 - 극도의 미니멀리즘
        ------------------------------------- */
        .intro-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #ffffff; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .intro-overlay.hidden {
            opacity: 0; transform: translateY(-5%); pointer-events: none;
        }
        
        .intro-content {
            text-align: center; opacity: 0; transform: translateY(20px);
            animation: fadeUpIn 1.5s ease forwards 0.5s;
        }
        
        .intro-logo {
            font-family: 'Playfair Display', serif; /* 감각적인 세리프 폰트 */
            font-size: 38px; font-weight: 700; color: #111; letter-spacing: 10px;
            margin-bottom: 8px; margin-right: -10px; /* 자간 보정 */
        }
        
        .intro-sub {
            font-size: 11px; font-weight: 500; color: #888; letter-spacing: 4px;
            text-transform: uppercase;
        }

        .intro-line {
            width: 1px; height: 50px; background: #ddd; margin: 40px auto;
        }
        
        .intro-bottom {
            position: absolute; bottom: 60px; opacity: 0;
            animation: fadeIn 2s ease forwards 1.8s;
        }
        .intro-bottom span {
            font-size: 10px; color: #aaa; letter-spacing: 4px; text-transform: uppercase;
            animation: pulse 2.5s infinite alternate;
        }

        @keyframes fadeUpIn { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes pulse { 0% { opacity: 0.3; } 100% { opacity: 1; } }

        /* -------------------------------------
           [2] 메인 배경 및 레이아웃
        ------------------------------------- */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #fdfdfd; z-index: -2;
        }
        .ambient-glow {
            position: fixed; width: 100vw; height: 100vw;
            background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, transparent 60%);
            top: -20vh; left: -20vw; border-radius: 50%; z-index: -1;
            transition: background 1s ease;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; z-index: 10; margin-bottom: 5px;
        }
        h1 { font-family: 'Playfair Display', serif; color: #111; font-size: 18px; font-weight: 700; letter-spacing: 1px;}
        .category-name { font-size: 12px; color: #888; margin-top: 4px; font-weight: 500; letter-spacing: 0.5px;}
        .menu-toggle-btn {
            background: transparent; border: 1px solid #ddd;
            color: #333; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 600;
            cursor: pointer; letter-spacing: 1px;
        }

        .slider-container { flex: 1; position: relative; width: 100%; overflow: hidden; display: flex; align-items: center; }
        .slider-track { display: flex; width: 100%; height: 95%; transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }

        /* -------------------------------------
           [3] 카드 내부 디자인 (미니멀 & 스크롤)
        ------------------------------------- */
        .card {
            min-width: 100vw; height: 100%; padding: 0 15px; 
            display: flex; flex-direction: column; justify-content: center;
            opacity: 0.3; transform: scale(0.92); transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .card.active { opacity: 1; transform: scale(1); }

        .card-content {
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 1); border-radius: 20px; padding: 25px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.04);
            height: 100%; width: 100%; overflow-y: auto; -ms-overflow-style: none; scrollbar-width: none;
        }
        .card-content::-webkit-scrollbar { display: none; }

        /* 사진 대신 코드로 그린 칵테일(SVG)이 떠 있는 공간 */
        .svg-wrapper {
            width: 100%; height: 190px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 25px;
        }

        .menu-title { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; color: #111; line-height: 1.1; margin-bottom: 6px; }
        .menu-kor { font-size: 14px; color: #a8905b; font-weight: 600; margin-bottom: 15px; letter-spacing: -0.5px;}
        .menu-desc { font-size: 13px; color: #666; line-height: 1.5; font-weight: 400; margin-bottom: 25px; }

        .info-box { border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 15px 0; margin-bottom: 20px;}
        .info-row { display: flex; align-items: center; margin-bottom: 10px; }
        .info-row:last-child { margin-bottom: 0; }
        .info-label { width: 85px; font-size: 10px; color: #999; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .info-value { font-size: 13px; color: #333; flex-grow: 1; display: flex; align-items: center; font-weight: 500;}
        .info-value.bold-num { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 700; color: #111; }
        
        .stars { color: #a8905b; letter-spacing: 2px;}
        .stars-empty { color: #eaeaea; letter-spacing: 2px;}

        .recipe-btn {
            width: 100%; padding: 14px; background: #111; color: #fff;
            border: none; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer;
            letter-spacing: 1px; transition: background 0.2s; margin-bottom: 10px;
        }
        .recipe-btn:active { background: #333; }

        /* -------------------------------------
           [4] 하단 컨트롤러 & 오버레이
        ------------------------------------- */
        .controls { display: flex; justify-content: space-between; align-items: center; padding: 10px 25px 25px; }
        .btn { background: none; border: none; color: #888; font-size: 20px; padding: 10px; cursor: pointer;}
        .btn:disabled { color: #ddd; }
        .dots-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .pagination { font-family: 'Playfair Display', serif; font-size: 12px; color: #888; letter-spacing: 2px; }
        .current-page { color: #111; font-weight: 700; }
        .dots { display: flex; gap: 6px; justify-content: center; }
        .dot { width: 4px; height: 4px; border-radius: 50%; background: #ddd; transition: all 0.3s; }
        .dot.active { width: 16px; background: #a8905b; border-radius: 4px; }

        .toc-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.98); z-index: 100; display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .toc-overlay.open { transform: translateY(0); }
        .toc-header { display: flex; justify-content: space-between; align-items: center; padding: 25px; border-bottom: 1px solid #f0f0f0; }
        .toc-header h2 { font-family: 'Playfair Display', serif; font-size: 18px; color: #111; font-weight: 700;}
        .sort-select { background: #f9f9f9; border: 1px solid #eee; padding: 8px 12px; border-radius: 6px; font-size: 11px; font-weight: 500; color: #555; outline: none;}
        .close-toc-btn { background: none; border: none; color: #333; font-size: 28px; cursor: pointer; font-weight: 300; }
        .toc-content { flex: 1; overflow-y: auto; padding: 10px 25px 40px; }
        .toc-category-title { font-size: 10px; color: #a8905b; letter-spacing: 2px; margin: 30px 0 15px; font-weight: 700;}
        .toc-item { display: flex; align-items: center; padding: 15px 10px; border-bottom: 1px solid #f5f5f5; cursor: pointer;}
        .toc-item-num { font-family: 'Playfair Display', serif; font-size: 13px; color: #bbb; width: 30px; font-style: italic;}
        .toc-item-name { font-size: 14px; color: #333; font-weight: 500;}
        .toc-item-current { background: #fcfbf9; border-left: 2px solid #a8905b; padding-left: 15px;}
        .toc-item-current .toc-item-name { color: #a8905b; font-weight: 700; }

        .recipe-dim {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.4); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.4s;
        }
        .recipe-dim.show { opacity: 1; pointer-events: auto; }
        .recipe-sheet {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #ffffff; border-radius: 28px 28px 0 0; z-index: 201;
            transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            padding: 20px 25px 40px; box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
        }
        .recipe-sheet.show { transform: translateY(0); }
        .recipe-handle { width: 36px; height: 4px; background: #e0e0e0; border-radius: 2px; margin: 0 auto 25px; }
        .recipe-title { font-family: 'Playfair Display', serif; font-size: 20px; color: #111; margin-bottom: 5px; font-weight: 700; }
        .recipe-glass { font-size: 12px; color: #a8905b; margin-bottom: 25px; font-weight: 500; letter-spacing: 0.5px;}
        .recipe-list { list-style: none; margin-bottom: 25px; }
        .recipe-list li { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f5f5f5; font-size: 13px; color: #555;}
        .recipe-list li span:last-child { font-weight: 600; color: #111; }
        .recipe-garnish { font-size: 12px; color: #666; background: #f8f9fa; padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center;}
        .warning-text { font-size: 10px; color: #999; text-align: center; letter-spacing: 0.5px;}
    </style>
</head>
<body>
    <!-- [1] 극도로 감각적인 타이틀 페이지 -->
    <div id="introPage" class="intro-overlay" onclick="closeIntro()">
        <div class="intro-content">
            <h1 class="intro-logo">SIHYEON</h1>
            <div class="intro-sub">Private Lounge & Bar</div>
            <div class="intro-line"></div>
            <div class="intro-sub" style="font-size: 9px; letter-spacing: 2px; color: #aaa;">Crafted for your moment</div>
        </div>
        <div class="intro-bottom">
            <span>Tap to enter</span>
        </div>
    </div>

    <!-- [2] 메인 앱 영역 -->
    <div class="ambient-bg"></div>
    <div class="ambient-glow"></div>
    
    <header>
        <div>
            <h1>Menu</h1>
            <div class="category-name" id="categoryName">🌊 Blue Ocean</div>
        </div>
        <button class="menu-toggle-btn" onclick="toggleToc()">INDEX</button>
    </header>

    <div class="slider-container" id="sliderContainer">
        <div class="slider-track" id="sliderTrack">
            <!-- 코드로 그린 아트웍이 여기에 생성됩니다 -->
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="prevBtn" onclick="moveSlide(-1)">←</button>
        <div class="dots-wrapper">
            <div class="dots" id="dotsContainer"></div>
            <div class="pagination"><span class="current-page" id="currentPage">1</span> / 20</div>
        </div>
        <button class="btn" id="nextBtn" onclick="moveSlide(1)">→</button>
    </div>

    <div class="toc-overlay" id="tocOverlay">
        <div class="toc-header">
            <h2>Index</h2>
            <select class="sort-select" id="sortSelect" onchange="applySortAndRender()">
                <option value="default">기본순</option>
                <option value="sweet">당도순</option>
                <option value="alc">도수순</option>
            </select>
            <button class="close-toc-btn" onclick="toggleToc()">×</button>
        </div>
        <div class="toc-content" id="tocContent"></div>
    </div>

    <div class="recipe-dim" id="recipeDim" onclick="closeRecipe()"></div>
    <div class="recipe-sheet" id="recipeSheet">
        <div class="recipe-handle"></div>
        <div id="recipeSheetContent"></div>
        <div class="warning-text">Drink responsibly.</div>
    </div>

            { cat: "🥂 Mix & Premium", name: "체리블라썸 애플", eng: "Cherry Blossom Apple", desc: "마티니처럼 달콤하면서도 알코올의 존재감이 기분 좋게 느껴지는 맛", sweet: 3, alc: 18, carb: "🫧", flavor: "벚꽃 향, 청사과", color: "은은한 핑크 🍒", grad: ["#ff0844", "#ffb199"],
              recipe: { glass: "마티니 잔", method: "Shake", abv: 18, ingredients: [{name:"스미노프 그린애플", amount:30, unit:"ml"}, {name:"카나데 사쿠라", amount:30, unit:"ml"}, {name:"사이다", amount:45, unit:"ml"}], garnish:"애플 슬라이스" } },
            { cat: "🥂 Mix & Premium", name: "퍼플 갤럭시", eng: "Purple Galaxy", desc: "붉은색과 푸른색이 섞이며 우주 같은 몽환적인 보랏빛 연출", sweet: 3, alc: 9, carb: "🫧", flavor: "솔향, 오렌지, 석류", color: "몽환적 보랏빛 🌌", grad: ["#cc2b5e", "#753a88"],
              recipe: { glass: "하이볼 잔", method: "Build", abv: 9, ingredients: [{name:"그레나딘 시럽", amount:15, unit:"ml(Bottom)"}, {name:"런던 드라이 진", amount:30, unit:"ml"}, {name:"사이다", amount:90, unit:"ml"}, {name:"블루 큐라소", amount:15, unit:"ml(Float)"}], garnish:"없음" } },
            { cat: "🥂 Mix & Premium", name: "스위트 AMF", eng: "Adios Mother F****", desc: "단맛과 청량함에 가려져 꿀꺽꿀꺽 넘어가는 파티용 폭탄주", sweet: 4, alc: 18, carb: "🫧", flavor: "청사과, 오렌지, 럼, 진", color: "투명 블루 💎", grad: ["#2193b0", "#6dd5ed"],
              recipe: { glass: "콜린스 잔", method: "Build", abv: 18, ingredients: [{name:"런던 드라이 진", amount:15, unit:"ml"}, {name:"바카디 화이트", amount:15, unit:"ml"}, {name:"스미노프 그린애플", amount:15, unit:"ml"}, {name:"블루 큐라소", amount:15, unit:"ml"}, {name:"사이다", amount:"Fill", unit:""}], garnish:"레몬 웻지" } },
            { cat: "🥂 Mix & Premium", name: "오리엔탈 선셋 하이볼", eng: "Oriental Sunset Highball", desc: "프리미엄 위스키의 오크 향에 꽃과 과일의 단맛이 더해진 럭셔리 하이볼", sweet: 3, alc: 14, carb: "🫧", flavor: "오크통 향, 벚꽃, 오렌지", color: "노을빛 붉은색 🌅", grad: ["#fc4a1a", "#f7b733"],
              recipe: { glass: "올드 패션드 잔", method: "Build", abv: 14, ingredients: [{name:"토고우치 18년", amount:15, unit:"ml"}, {name:"카나데 사쿠라", amount:15, unit:"ml"}, {name:"오렌지 주스", amount:60, unit:"ml"}, {name:"그레나딘 시럽", amount:15, unit:"ml(Float)"}], garnish:"오렌지 필" } },
            { cat: "🥂 Mix & Premium", name: "진 앤 베리 블리스", eng: "Gin & Berry Bliss", desc: "복분자의 무거운 단맛을 진이 깔끔하게 잡아주는 와인 에이드 스타일", sweet: 3, alc: 11, carb: "🫧", flavor: "진한 복분자, 허브 향", color: "검붉은 와인색 🍷", grad: ["#8e0e00", "#1f1c18"],
              recipe: { glass: "와인 잔", method: "Build", abv: 11, ingredients: [{name:"런던 드라이 진", amount:30, unit:"ml"}, {name:"복분자", amount:30, unit:"ml"}, {name:"사이다", amount:60, unit:"ml"}], garnish:"로즈마리" } },
            { cat: "🥂 Mix & Premium", name: "코코넛 애플 브리즈", eng: "Coconut Apple Breeze", desc: "스크류바 아이스크림을 연상케 하는 친숙하고 기분 좋은 단맛", sweet: 4, alc: 13, carb: "❌", flavor: "코코넛, 청사과, 달콤한 석류", color: "코럴 빛깔 🍹", grad: ["#ff9966", "#ff5e62"],
              recipe: { glass: "마티니 잔", method: "Shake", abv: 13, ingredients: [{name:"말리부", amount:30, unit:"ml"}, {name:"스미노프 그린애플", amount:30, unit:"ml"}, {name:"파인애플 주스", amount:60, unit:"ml"}, {name:"그레나딘 시럽", amount:15, unit:"ml(Sink)"}], garnish:"체리" } }
        ];

        let activeIndices = [];
        let currentIndex = 0;
        let cards = [];
        const track = document.getElementById('sliderTrack');
        const tocContent = document.getElementById('tocContent');

        function applySortAndRender() {
            const sortMode = document.getElementById('sortSelect').value;
            activeIndices = menuData.map((_, i) => i);
            if (sortMode === 'sweet') activeIndices.sort((a,b) => menuData[b].sweet - menuData[a].sweet);
            if (sortMode === 'alc') activeIndices.sort((a,b) => menuData[b].alc - menuData[a].alc);
            
            currentIndex = 0; 
            renderCards();
            renderTOC();
            updateSlider();
        }

        const getStars = (count) => `<span class="stars">${'★'.repeat(count)}</span><span class="stars-empty">${'★'.repeat(5 - count)}</span>`;

        // [핵심] 코드로 칵테일 잔과 액체를 완벽하게 그리는 SVG 생성 함수 (절대 안 깨짐)
        function createGlassSVG(glassType, grad, cid) {
            const defs = `<defs>
                <linearGradient id="g-${cid}" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="${grad[0]}"/>
                    <stop offset="100%" stop-color="${grad[1]}"/>
                </linearGradient>
                <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="rgba(200,200,200,0.5)"/>
                    <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
                    <stop offset="100%" stop-color="rgba(200,200,200,0.8)"/>
                </linearGradient>
            </defs>`;

            let shape = '';
            const s = `stroke="url(#glass)" stroke-width="2" fill="none"`;
            const l = `fill="url(#g-${cid})" opacity="0.85"`;

            if (glassType.includes('하이볼') || glassType.includes('콜린스')) {
                shape = `
                    <path d="M30 60 L70 60 L67 135 L33 135 Z" ${l} />
                    <path d="M25 20 L75 20 M28 20 L33 135 A 5 5 0 0 0 38 140 L62 140 A 5 5 0 0 0 67 135 L72 20" ${s} />`;
            } else if (glassType.includes('마티니')) {
                shape = `
                    <path d="M15 25 L85 25 L50 65 Z" ${l} />
                    <path d="M10 20 L90 20 L50 70 Z M50 70 L50 135 M30 135 L70 135" ${s} />`;
            } else if (glassType.includes('올드')) {
                shape = `
                    <path d="M25 80 L75 80 L72 135 L28 135 Z" ${l} />
                    <path d="M20 50 L80 50 M22 50 L28 135 A 5 5 0 0 0 33 140 L67 140 A 5 5 0 0 0 72 135 L78 50" ${s} />`;
            } else if (glassType.includes('와인') || glassType.includes('쿠페')) {
                shape = `
                    <path d="M20 40 Q 50 110 80 40 Z" ${l} />
                    <path d="M15 30 Q 50 120 85 30 Z M50 85 L50 135 M30 135 L70 135" ${s} />`;
            } else { // 허리케인
                shape = `
                    <path d="M35 50 C 35 70 45 80 45 90 C 45 105 35 115 35 125 L65 125 C 65 115 55 105 55 90 C 55 80 65 70 65 50 Z" ${l} />
                    <path d="M30 20 C 30 50 45 70 45 90 C 45 110 30 130 30 130 L70 130 C 70 110 55 90 55 70 C 55 50 70 20 70 20 Z" ${s} />`;
            }

            return `<svg viewBox="0 0 100 150" style="width:auto; height:100%; filter: drop-shadow(0 15px 25px ${grad[0]}50);">${defs}${shape}</svg>`;
        }

        function renderCards() {
            track.innerHTML = '';
            let dotsHtml = '';
            
            activeIndices.forEach((rawIndex, idx) => {
                const menu = menuData[rawIndex];
                const card = document.createElement('div');
                card.className = `card`;
                
                card.innerHTML = `
                    <div class="card-content">
                        <!-- 코드로 그려진 아름답고 완벽한 칵테일 아트워크 -->
                        <div class="svg-wrapper">
                            ${createGlassSVG(menu.recipe.glass, menu.grad, idx)}
                        </div>

                        <div class="menu-title">${menu.eng}</div>
                        <div class="menu-kor">${menu.name}</div>
                        <div class="menu-desc">"${menu.desc}"</div>

                        <div class="info-box">
                            <div class="info-row"><span class="info-label">Sweetness</span><span class="info-value">${getStars(menu.sweet)}</span></div>
                            <div class="info-row"><span class="info-label">Strength</span><span class="info-value bold-num">${menu.alc}%</span></div>
                            <div class="info-row"><span class="info-label">Sparkling</span><span class="info-value">${menu.carb}</span></div>
                        </div>
                        <button class="recipe-btn" onclick="openRecipe(${rawIndex})">View Recipe</button>
                    </div>
                `;
                track.appendChild(card);
                dotsHtml += `<div class="dot" id="dot-${idx}"></div>`;
            });
            
            document.getElementById('dotsContainer').innerHTML = dotsHtml;
            document.getElementById('currentPage').parentNode.innerHTML = `<span class="current-page" id="currentPage">1</span> / ${activeIndices.length}`;
            cards = document.querySelectorAll('.card');
        }

        function renderTOC() {
            tocContent.innerHTML = '';
            let currentCategory = "";
            activeIndices.forEach((rawIndex, idx) => {
                const menu = menuData[rawIndex];
                if (menu.cat !== currentCategory && document.getElementById('sortSelect').value === 'default') {
                    const catTitle = document.createElement('div');
                    catTitle.className = 'toc-category-title';
                    catTitle.innerText = menu.cat;
                    tocContent.appendChild(catTitle);
                    currentCategory = menu.cat;
                }
                const tocItem = document.createElement('div');
                tocItem.className = 'toc-item';
                tocItem.onclick = () => { currentIndex = idx; updateSlider(); toggleToc(); };
                tocItem.innerHTML = `<span class="toc-item-num">${String(idx + 1).padStart(2, '0')}</span><span class="toc-item-name">${menu.name}</span>`;
                tocContent.appendChild(tocItem);
            });
        }

        function updateSlider() {
            track.style.transform = `translateX(-${currentIndex * 100}vw)`;
            cards.forEach((c, i) => {
                c.classList.toggle('active', i === currentIndex);
                if(i === currentIndex) c.querySelector('.card-content').scrollTop = 0; 
            });
            
            const rawIndex = activeIndices[currentIndex];
            const currentMenu = menuData[rawIndex];
            
            document.getElementById('categoryName').innerText = currentMenu.cat;
            document.getElementById('currentPage').innerText = currentIndex + 1;
            
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === currentIndex));
            
            document.querySelector('.ambient-glow').style.background = `radial-gradient(circle, ${currentMenu.grad[0]}25 0%, transparent 60%)`;

            saveProgress();
            if(document.getElementById('tocOverlay').classList.contains('open')) highlightCurrentToc();
        }

        function moveSlide(dir) {
            currentIndex = Math.max(0, Math.min(currentIndex + dir, activeIndices.length - 1));
            updateSlider();
        }

        let startX = 0, isDragging = false;
        const sliderContainer = document.getElementById('sliderContainer');

        sliderContainer.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            isDragging = true;
            track.style.transition = 'none';
        }, {passive: true});

        sliderContainer.addEventListener('touchmove', e => {
            if (!isDragging) return;
            const deltaX = e.touches[0].clientX - startX;
            const basePx = -currentIndex * window.innerWidth;
            track.style.transform = `translateX(${basePx + deltaX}px)`;
        }, {passive: true});

        sliderContainer.addEventListener('touchend', e => {
            if (!isDragging) return;
            isDragging = false;
            track.style.transition = 'transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
            const deltaX = e.changedTouches[0].clientX - startX;
            
            if (deltaX < -40) moveSlide(1);
            else if (deltaX > 40) moveSlide(-1);
            else updateSlider(); 
        }, {passive: true});

        function toggleToc() {
            const overlay = document.getElementById('tocOverlay');
            overlay.classList.toggle('open');
            if(overlay.classList.contains('open')) highlightCurrentToc();
        }

        function highlightCurrentToc() {
            const items = document.querySelectorAll('.toc-item');
            items.forEach((item, i) => item.classList.toggle('toc-item-current', i === currentIndex));
            items[currentIndex]?.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }

        function openRecipe(rawIndex) {
            const data = menuData[rawIndex];
            const r = data.recipe;
            const ingsHtml = r.ingredients.map(ing => `<li><span>${ing.name}</span><span>${ing.amount}${ing.unit}</span></li>`).join('');
            
            document.getElementById('recipeSheetContent').innerHTML = `
                <h3 class="recipe-title">${data.name}</h3>
                <div class="recipe-glass">🥃 ${r.glass} · ${r.method} · ABV ${r.abv}%</div>
                <ul class="recipe-list">${ingsHtml}</ul>
                <div class="recipe-garnish">가니시: ${r.garnish}</div>
            `;
            document.getElementById('recipeDim').classList.add('show');
            document.getElementById('recipeSheet').classList.add('show');
        }

        function closeRecipe() {
            document.getElementById('recipeDim').classList.remove('show');
            document.getElementById('recipeSheet').classList.remove('show');
        }

        function saveProgress() {
            try { localStorage.setItem('lastRawIndex', activeIndices[currentIndex]); } catch(e) {}
        }
        function loadProgress() {
            try {
                const saved = localStorage.getItem('lastRawIndex');
                if (saved !== null) {
                    const idx = activeIndices.indexOf(parseInt(saved));
                    if (idx !== -1) currentIndex = idx;
                }
            } catch(e) {}
        }

        applySortAndRender(); 
        loadProgress();       
        updateSlider();       
    </script>
</body>
</html>
